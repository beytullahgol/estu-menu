name: ESTÜ menü verisini güncelle

on:
  schedule:
    # GitHub Actions UTC kullanır.
    # Salı–pazar: 08:05 TR günlük cache-only üretim (ESTÜ isteği yok).
    - cron: "5 5 * * 0,2-6"
    # Pazartesi: Akademik Kulüp için 08:03–16:03 TR arasında 30 dakikalık pencere.
    - cron: "3,33 5-12 * * 1"
    - cron: "3 13 * * 1"
    # Ayın 1'i: Ana yemekhane için aynı 30 dakikalık pencere.
    - cron: "3,33 5-12 1 * *"
    - cron: "3 13 1 * *"
  workflow_dispatch:
    inputs:
      date:
        description: "İsteğe bağlı test tarihi (GG.AA.YYYY); boş bırakılırsa bugün"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  collect:
    name: Menüyü topla ve Pages'e yayımla
    runs-on: ubuntu-latest
    steps:
      - name: Repository'yi al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python'u kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Menü JSON'unu üret
        env:
          REQUESTED_DATE: ${{ inputs.date }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$REQUESTED_DATE" ]; then
            python scripts/collect_menu.py \
              --date "$REQUESTED_DATE" \
              --mode refresh \
              --output "data/test/${REQUESTED_DATE}.json"
          elif { [ "$SCHEDULE" = "3,33 5-12 * * 1" ] || [ "$SCHEDULE" = "3 13 * * 1" ]; } \
               && [ "$(TZ=Europe/Istanbul date +%d)" = "01" ]; then
            echo "Ayın 1'i pazartesiye denk geldi; haftalık cron çalışması aylık cron tarafından yinelenmemesi için atlandı."
          elif { [ "$SCHEDULE" = "3,33 5-12 1 * *" ] || [ "$SCHEDULE" = "3 13 1 * *" ]; } \
               && [ "$(TZ=Europe/Istanbul date +%u)" -ge 6 ]; then
            echo "Ayın 1'i hafta sonu; aylık yenileme ilk uygun pazartesiye bırakıldı."
          elif [ "$SCHEDULE" = "5 5 * * 0,2-6" ] \
               && [ "$(TZ=Europe/Istanbul date +%d)" = "01" ] \
               && [ "$(TZ=Europe/Istanbul date +%u)" -le 5 ]; then
            echo "Ayın 1'i hafta içi; günlük cache-only çalışması aylık yenileme ile çakışmaması için atlandı."
          else
            python scripts/collect_menu.py --mode auto
          fi

      - name: Manuel test çıktısını artifact olarak yükle
        if: ${{ inputs.date }}
        uses: actions/upload-artifact@v4
        with:
          name: menu-test-${{ inputs.date }}
          path: data/test/${{ inputs.date }}.json
          if-no-files-found: error

      - name: Manuel test JSON'unu raw endpoint olarak commit et
        if: ${{ inputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/test/${REQUESTED_DATE}.json" data/cache
          if git diff --cached --quiet; then
            echo "Test JSON'u veya cache değişmedi; yeni commit oluşturulmayacak."
          else
            git commit -m "test: ESTÜ menüsü ${REQUESTED_DATE}"
            git push
          fi
        env:
          REQUESTED_DATE: ${{ inputs.date }}

      - name: Güncel JSON'u commit et ve semver tag oluştur
        if: ${{ !inputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/menu.json data/cache
          if git diff --cached --quiet; then
            echo "Menü veya cache değişmedi; yeni commit oluşturulmayacak."
            echo "RELEASE_TAG=" >> "$GITHUB_ENV"
          else
            TAG_NAME="v0.0.${GITHUB_RUN_NUMBER}"
            if git show-ref --tags --quiet "refs/tags/${TAG_NAME}"; then
              TAG_NAME="v0.0.${GITHUB_RUN_NUMBER}-attempt.${GITHUB_RUN_ATTEMPT}"
            fi
            git commit -m "chore: güncel ESTÜ menüsünü yayımla"
            git tag "$TAG_NAME"
            git push origin HEAD:main "$TAG_NAME"
            echo "RELEASE_TAG=$TAG_NAME" >> "$GITHUB_ENV"
            echo "Yeni CDN release tag'i: $TAG_NAME"
          fi

      - name: jsDelivr alias cache'lerini temizle
        if: ${{ !inputs.date }}
        run: |
          for url in \
            "https://purge.jsdelivr.net/gh/beytullahgol/estu-menu/data/menu.json" \
            "https://purge.jsdelivr.net/gh/beytullahgol/estu-menu@latest/data/menu.json" \
            "https://purge.jsdelivr.net/gh/beytullahgol/estu-menu@main/data/menu.json"; do
            echo "Purge: $url"
            curl --fail --silent --show-error --location --retry 3 --max-time 30 "$url"
            echo
          done

      - name: GitHub Pages ayarını hazırla
        if: ${{ !inputs.date }}
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Pages sitesini hazırla
        if: ${{ !inputs.date }}
        run: |
          rm -rf site
          mkdir -p site/data
          cp data/menu.json site/data/menu.json
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="tr">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESTÜ Menü JSON</title></head>
          <body>
            <main>
              <h1>ESTÜ yemekhane menüsü</h1>
              <p>iOS Kestirmeleri için güncel veri: <a href="data/menu.json">data/menu.json</a></p>
            </main>
          </body>
          </html>
          HTML

      - name: Pages çıktısını yükle
        if: ${{ !inputs.date }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

      - name: GitHub Pages'e dağıt
        if: ${{ !inputs.date }}
        id: deployment
        uses: actions/deploy-pages@v4
